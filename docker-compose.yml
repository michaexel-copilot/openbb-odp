# OpenBB ODP API behind Traefik (Hostinger "Docker and Traefik" VPS template).
# Traefik runs in host network mode and finds the container through the Docker
# socket, so no shared network is needed.
#
# The ODP API has no working authentication of its own, so Traefik only routes
# requests that carry the header  X-API-Key: <ODP_API_KEY>  (all others get 404).
# CORS preflight requests (OPTIONS) are routed without the key because browsers
# send them without custom headers; this is what lets OpenBB Workspace connect.
# Generate the key with:  openssl rand -hex 24  and put it in .env.
services:
  openbb-odp:
    image: ghcr.io/michaexel-copilot/openbb-odp:latest
    container_name: openbb-odp
    restart: unless-stopped
    environment:
      # Optional data provider keys, e.g. OPENBB_FMP_API_KEY (see docs.openbb.co)
      OPENBB_API_HOST: 0.0.0.0
    volumes:
      - openbb-odp-home:/home/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.openbb-odp.rule=Host(`${ODP_DOMAIN:-odp.michaexel.de}`) && (Method(`OPTIONS`) || Header(`X-API-Key`, `${ODP_API_KEY:?set ODP_API_KEY}`))
      - traefik.http.routers.openbb-odp.entrypoints=websecure
      - traefik.http.routers.openbb-odp.tls=true
      - traefik.http.routers.openbb-odp.tls.certresolver=letsencrypt
      - traefik.http.services.openbb-odp.loadbalancer.server.port=6900

volumes:
  openbb-odp-home:
